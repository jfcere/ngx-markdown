version: 2.1

jobs:
  build:
    docker:
      # node 24.16 + browsers, digest resolved 2026-09-27.
      #
      # The tag alone is mutable: pinning the digest stops a re-tag upstream
      # from changing the toolchain with no commit behind it. The trade-off is
      # that base-image security updates only land when this is refreshed, so
      # bump tag and digest together:
      #   docker pull cimg/node:24.16-browsers
      #   docker inspect --format='{{index .RepoDigests 0}}' cimg/node:24.16-browsers
      - image: cimg/node:24.16-browsers@sha256:50d45d9ffc7db42251dc5c6d82a620fa5c6f9a585bd6e8d57376f81210b670c7
    steps:
      # Checkout the source code
      - checkout

      # Restore dependencies from cache
      - restore_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}

      # Install dependencies
      - run:
          name: Install dependencies
          command: npm ci

      # Install the browser Vitest drives (not shipped by `npm ci`). No
      # `--with-deps`: that needs `sudo apt-get` for xvfb, which only headed
      # runs require. Cheap no-op once the cache holds the browser.
      - run:
          name: Install Playwright chromium
          command: npx playwright install chromium

      # Cache dependencies (including the Playwright browser download)
      - save_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
            - ./node_modules
            - ~/.cache/ms-playwright

      # Vite regression check for optional KaTeX peer
      - run:
          name: Vite optional import regression
          command: npm run test:vite

      # Run tests
      - run:
          name: Test
          command: npm run test:ci

      # Store test results for tests tab in CircleCI UI. These steps run even
      # when the suite above fails, so a red build still reports which specs
      # broke (`when` is not a valid attribute here).
      - store_test_results:
          path: test-results.xml

      # Store downloadable artifacts
      - store_artifacts:
          path: test-results.xml
          prefix: tests
      - store_artifacts:
          path: coverage
          prefix: coverage

      # Upload coverage to Coveralls using the official self-contained reporter
      # instead of the unmaintained `coveralls` npm package
      - run:
          name: Push coverage artifacts
          command: |
            # Pinned release + checksum instead of piping the unversioned
            # `coveralls.io/coveralls-linux.tar.gz` straight into tar: that URL
            # always serves the latest build, so the binary running here could
            # change without any commit. Bump COVERALLS_VERSION and CHECKSUM
            # together from the release's coveralls-checksums.txt.
            COVERALLS_VERSION=v0.6.22
            COVERALLS_SHA256=cd042b63bcb2c03fd0fd3372c040507331f5013a997828071e2ab7f9584fc7d6
            curl -fsSL -o coveralls.tar.gz \
              "https://github.com/coverallsapp/coverage-reporter/releases/download/${COVERALLS_VERSION}/coveralls-linux.tar.gz"
            echo "${COVERALLS_SHA256}  coveralls.tar.gz" | sha256sum --check --strict
            sudo tar -xz -C /usr/local/bin -f coveralls.tar.gz
            rm coveralls.tar.gz
            coveralls report coverage/lib/lcov.info

      # Type-check
      - run:
          name: Type-Check
          command: npm run type-check

      # Lint
      - run:
          name: Lint
          command: npm run lint:ci
      - store_artifacts:
          path: eslint.xml
          prefix: lint

      # Build the source code
      - run:
          name: Build lib
          command: npm run build:lib

      # Build demo for gh-pages (same as deploy to catch issues early)
      - run:
          name: Build gh-pages demo
          command: |
            npm run gh-pages:build
            npm run gh-pages:postbuild

  deploy:
    docker:
      # node 24.16 + browsers, digest resolved 2026-09-27.
      #
      # The tag alone is mutable: pinning the digest stops a re-tag upstream
      # from changing the toolchain with no commit behind it. The trade-off is
      # that base-image security updates only land when this is refreshed, so
      # bump tag and digest together:
      #   docker pull cimg/node:24.16-browsers
      #   docker inspect --format='{{index .RepoDigests 0}}' cimg/node:24.16-browsers
      - image: cimg/node:24.16-browsers@sha256:50d45d9ffc7db42251dc5c6d82a620fa5c6f9a585bd6e8d57376f81210b670c7
    steps:
      # Checkout the source code
      - checkout

      # Restore dependencies from cache
      - restore_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}

      # Install dependencies
      - run:
          name: Install dependencies
          command: npm ci

      # Cache dependencies
      - save_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
            - ./node_modules

      # Build demo for gh-pages
      - run:
          name: Build gh-pages demo
          command: |
            npm run gh-pages:build
            npm run gh-pages:postbuild

      # Deploy demo to GitHub Pages
      - run:
          name: Deploy to gh-pages
          command: npm run gh-pages:deploy

workflows:
  build_and_deploy:
    # Do not run workflow when the pipeline is triggered from gh-pages branch
    when:
      not:
        equal: [gh-pages, << pipeline.git.branch >>]

    jobs:
      # Build for all branches and all tags
      - build:
          filters:
            tags:
              only: /.*/

      # Deploy only for version tags (vX.Y.Z) on the master branch
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: master
            tags:
              only: /v[0-9]+(\.[0-9]+)*/
